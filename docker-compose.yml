# Local development stack: backend services + TimescaleDB/PostGIS + Redis + Redpanda.
# Dashboard runs separately (see dashboard/README.md).
# Not for production; see infra/ for Kubernetes/Helm.

x-db-env: &db-env
  DATABASE_URL: postgresql://defense:defense@postgres:5432/defense

x-broker-env: &broker-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:29092

services:
  # TimescaleDB-HA bundles PostGIS, which the geofence and flight-track
  # geometry columns require. Plain postgres:15-alpine will not boot the schema.
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: defense
      POSTGRES_PASSWORD: defense
      POSTGRES_DB: defense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./backend/db/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defense -d defense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redpanda replaces Kafka + Zookeeper: single binary, Kafka-API compatible,
  # two fewer containers and a much faster cold start for CI.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  asset-service:
    build: { context: ./backend, dockerfile: services/asset_service/Dockerfile }
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8001:8000"]

  telemetry-service:
    build: { context: ./backend, dockerfile: services/telemetry_service/Dockerfile }
    environment:
      <<: [*db-env, *broker-env]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["8002:8000"]

  alert-service:
    build: { context: ./backend, dockerfile: services/alert_service/Dockerfile }
    environment:
      <<: [*db-env, *broker-env]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["8003:8000"]

  control-service:
    build: { context: ./backend, dockerfile: services/control_service/Dockerfile }
    environment:
      <<: [*db-env, *broker-env]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8004:8000"]

  inference-service:
    build: { context: ./backend, dockerfile: services/inference_service/Dockerfile }
    environment:
      <<: *broker-env
      MODEL_PATH: ${MODEL_PATH:-}
    depends_on:
      redpanda: { condition: service_healthy }
    ports: ["8005:8000"]

  auth-service:
    build: { context: ./backend, dockerfile: services/auth_service/Dockerfile }
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod_min_32_chars_required}
      JWT_ISSUER: defense-api
      JWT_AUDIENCE: defense-dashboard
      ACCESS_TOKEN_TTL_MIN: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8006:8000"]

  api-gateway:
    build: { context: ./backend, dockerfile: services/api_gateway/Dockerfile }
    environment:
      ASSET_SERVICE_URL: http://asset-service:8000
      TELEMETRY_SERVICE_URL: http://telemetry-service:8000
      ALERT_SERVICE_URL: http://alert-service:8000
      CONTROL_SERVICE_URL: http://control-service:8000
      INFERENCE_SERVICE_URL: http://inference-service:8000
      AUTH_SERVICE_URL: http://auth-service:8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod_min_32_chars_required}
      JWT_ISSUER: defense-api
      JWT_AUDIENCE: defense-dashboard
      # NOTE: no ALLOW_DEV_TOKEN. The dev-token backdoor granted super_admin
      # to any caller and has been removed. Use auth-service /login.
    depends_on:
      - asset-service
      - telemetry-service
      - alert-service
      - control-service
      - inference-service
      - auth-service
    ports: ["8000:8000"]

volumes:
  pgdata:
